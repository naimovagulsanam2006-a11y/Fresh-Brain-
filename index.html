body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:calc(70px + env(safe-area-inset-bottom,0px))}
main{padding:16px;max-width:560px;margin:0 auto}

.sub{color:var(--sub);font-size:14px}
textarea{width:100%;min-height:90px;border-radius:12px;border:1px solid var(--sub);padding:10px;font:inherit;background:var(--bg);color:var(--tx)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--cd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;color:var(--sub);font-size:12px;padding:6px 2px}
nav button.on{color:var(--bt);font-weight:700}
nav span{display:block;font-size:20px}

li{margin:8px 0}
.kr{display:flex;gap:5px;justify-content:center;margin:5px 0}.kr button{flex:1;padding:12px 0;min-width:0}
</style>

<div class="sub">Jami 45 ta so'z: A1 (10), A2 (10), B1 (10), B2 (10), C1 (5).</div></div><button onclick="begin()">Boshlash ▶️</button>`;
}
function begin(){S={lvl:0,pool:LW.map(a=>shuffle(a))};startRound();}
function draw(l){if(S.pool[l].length<RS)S.pool[l]=shuffle(LW[l]);return S.pool[l].splice(0,RS);}
function startRound(){S.words=draw(S.lvl);S.i=0;S.lost=0;S.res=[];newWord();}
function newWord(){const w=S.words[S.i];G={w:w[0],h:w[1],t:[],l:3,st:"play",msg:""};drawGame();}
function chips(){return `<div style="margin-bottom:8px">`+LV.map((x,i)=>`<span style="display:inline-block;padding:4px 10px;margin:2px;border-radius:10px;background:${i==S.lvl?"var(--bt)":"var(--cd)"};color:${i==S.lvl?"var(--bx)":"var(--sub)"}">${x}</span>`).join("")+`</div>`;}
function drawGame(){
 const n=G.w.length,play=G.st=="play";
 const slots=[...G.w].map((c,i)=>`<span style="display:inline-block;min-width:22px;border-bottom:3px solid var(--sub);margin:0 3px;text-align:center">${G.st=="lost"?c.toUpperCase():(G.t[i]?G.t[i].toUpperCase():"&nbsp;")}</span>`).join("");
 let kb="";
 if(play){kb=["qwertyuiop","asdfghjkl","zxcvbnm"].map((r,ri)=>`<div class="kr">${[...r].map(c=>`<button onclick="typeL('${c}')">${c.toUpperCase()}</button>`).join("")}${ri==2?`<button class="alt" onclick="backL()">⌫</button>`:""}</div>`).join("")+`<p><button ${G.t.length==n?"":"disabled"} onclick="checkW()" style="width:100%">Tekshirish ✅</button></p>`;}
 app.innerHTML=`<h2>🧠 Fresh Brain</h2>${chips()}<div class="sub">${LV[S.lvl]} · so'z ${S.i+1}/${RS}</div><div class="card"><div class="sub">Ma'nosi: <b>${esc(G.h)}</b></div><div class="word" style="letter-spacing:0">${slots}</div><div style="text-align:center">${"❤️".repeat(G.l)}${"🖤".repeat(3-G.l)}</div>${G.msg?`<p style="text-align:center">${G.msg}</p>`:""}${G.st=="won"?"<p style='text-align:center'>🎉 <b>To'g'ri!</b></p>":""}${G.st=="lost"?`<p style="text-align:center">😅 Bu safar topilmadi. To'g'ri javob: <b>${G.w}</b></p>`:""}</div>${play?kb:`<button onclick="nextWord(${G.st=="won"})">Keyingisi ➡️</button>`}`;
}
function typeL(c){if(G.t.length<G.w.length){G.t.push(c);G.msg="";drawGame();}}
function backL(){G.t.pop();G.msg="";drawGame();}
function checkW(){
 if(G.t.join("")==G.w){G.st="won";}
 else{G.l--;G.t=[];if(G.l<=0)G.st="lost";else G.msg="❌ Noto'g'ri. Qayta urinib ko'ring.";}
 drawGame();
}
function nextWord(won){S.res.push([G.w,G.h,won]);if(!won)S.lost++;S.i++;if(S.i<RS)newWord();else endRound();}
function endRound(){
 const pass=S.lost==0,old=LV[S.lvl];let msg,btn;
 const list=S.res.map(r=>`<li>${r[2]?"✅":"❌"} <b>${esc(r[0])}</b> — ${esc(r[1])}</li>`).join("");
 if(pass&&S.lvl==4){msg="🏆 <b>Tabriklaymiz!</b> C1 darajagacha yetib keldingiz.";btn=`<button onclick="fresh()">🔄 Boshidan</button>`;}
 else if(pass){S.lvl++;msg=`👏 Hammasi to'g'ri! Keyingi daraja: <b>${LV[S.lvl]}</b>`;btn=`<button onclick="startRound()">Davom etish ➡️</button>`;}
 else{S.lvl=Math.max(0,S.lvl-1);msg=`Xato bo'ldi (${S.lost} ta). ${old==LV[S.lvl]?"Shu darajada yana urinamiz":"Yana <b>"+LV[S.lvl]+"</b> darajaga qaytamiz"}.`;btn=`<button onclick="startRound()">Davom etish ➡️</button>`;}
 app.innerHTML=`<h2>📋 ${old} natijasi</h2><div class="card"><ul style="padding-left:18px">${list}</ul></div><p>${msg}</p>${btn}`;
}

/* O'yinlar menyusi */
function game(){app.innerHTML=`<h2>🎮 O'yinlar</h2><button class="opt" onclick="fresh()">🧠 <b>Fresh Brain</b><br><span class="sub">So'zlarni yozib topasiz: A1 dan C1 gacha</span></button><button class="opt" onclick="mem()">🃏 <b>Juftini top</b><br><span class="sub">Dam olish uchun: inglizcha so'z va ma'nosini juftlang</span></button><button class="opt" onclick="wordle()">🟩 <b>5 harfli so'z</b><br><span class="sub">6 urinishda yashirin so'zni toping, rangli maslahatlar bilan</span></button>`;}

/* Juftini top */
let M;
function mem(){
 app.innerHTML=`<h2>🃏 Juftini top</h2><p class="sub">Kartalarni oching va inglizcha so'zni uning o'zbekcha ma'nosi bilan juftlang. Shoshilmang, vaqt hisoblanmaydi. Urinish soni qancha kam bo'lsa, shuncha ko'p yulduz olasiz.</p><button class="opt" onclick="memStart(6)">🙂 Oson · 6 juft</button><button class="opt" onclick="memStart(8)">😎 O'rta · 8 juft</button><button class="opt" onclick="memStart(10)">🔥 Qiyin · 10 juft</button><p class="sub" id="mb"></p><button class="alt" onclick="game()">⬅️ O'yinlar</button>`;
 store.get("memBest",v=>{let b={};try{b=JSON.parse(v)||{}}catch(e){}window._mb=b;const e=document.getElementById("mb");if(e&&Object.keys(b).length)e.textContent="🏅 Eng yaxshi: "+Object.entries(b).map(([k,x])=>k+" juft — "+x+" urinish").join(" · ");});
}
function memStart(n){
 const lv=n==6?[0,1]:n==8?[1,2,3]:[2,3,4];
 const pairs=shuffle([].concat(...lv.map(i=>LW[i]))).slice(0,n);
 const cards=[];pairs.forEach((w,i)=>{cards.push({id:i,t:w[0],en:true});cards.push({id:i,t:w[1].split(",")[0],en:false});});
 M={n,pairs,cards:shuffle(cards),open:[],done:new Set(),moves:0,lock:false};
 memDraw();
}
function memDraw(){
 const cols=M.n==6?3:4;
 app.innerHTML=`<h2>🃏 Juftini top</h2><div class="sub">Urinishlar: <b id="mm">${M.moves}</b> · Topilgan: <b id="mp">${M.done.size/2}</b>/${M.n}</div><div class="mg" style="grid-template-columns:repeat(${cols},1fr)">${M.cards.map((c,i)=>`<div class="mc" id="c${i}" onclick="flip(${i})"><div class="mi"><div class="mf">?</div><div class="mk ${c.en?"en":"uz"}">${esc(c.t)}</div></div></div>`).join("")}</div><p><button class="alt" onclick="mem()">⬅️ Chiqish</button></p>`;
}
function flip(i){
 if(M.lock||M.open.includes(i)||M.done.has(i))return;
 document.getElementById("c"+i).classList.add("up");M.open.push(i);
 if(M.open.length<2)return;
 M.moves++;document.getElementById("mm").textContent=M.moves;
 const [a,b]=M.open,ea=document.getElementById("c"+a),eb=document.getElementById("c"+b);
 if(M.cards[a].id==M.cards[b].id){
  M.done.add(a);M.done.add(b);ea.classList.add("ok");eb.classList.add("ok");M.open=[];
  document.getElementById("mp").textContent=M.done.size/2;
  if(M.done.size==M.cards.length)setTimeout(memEnd,800);
 }else{
  M.lock=true;
  setTimeout(()=>{ea.classList.remove("up");eb.classList.remove("up");M.open=[];M.lock=false;},900);
 }
}
function memEnd(){
 const n=M.n,m=M.moves,st=m<=n+2?"⭐⭐⭐":m<=Math.ceil(n*1.7)?"⭐⭐":"⭐";
 const b=window._mb||{};let rec="";
 if(!b[n]||m<b[n]){b[n]=m;window._mb=b;store.set("memBest",JSON.stringify(b));rec="<p>🏅 <b>Yangi rekord!</b></p>";}
 const list=M.pairs.map(w=>`<li><b>${esc(w[0])}</b> — ${esc(w[1])}</li>`).join("");
 app.innerHTML=`<h2>🎉 Barakalla!</h2><div class="card"><div class="word">${st}</div><p style="text-align:center">${m} ta urinishda topdingiz</p>${rec}</div><div class="card"><b>Shu o'yindagi so'zlar:</b><ul style="padding-left:18px">${list}</ul></div><button onclick="memStart(${n})">🔄 Yana o'ynash</button> <button class="alt" onclick="mem()">Daraja</button> <button class="alt" onclick="game()">O'yinlar</button>`;
}

/* 5 harfli so'z (Wordle uslubi) */
const W5=[["apple","olma"],["bread","non"],["water","suv"],["house","uy"],["world","dunyo"],["light","yorug'lik"],["music","musiqa"],["dream","orzu, tush"],["happy","baxtli"],["green","yashil"],["smile","tabassum"],["money","pul"],["plant","o'simlik"],["clean","toza"],["sleep","uyqu"],["river","daryo"],["story","hikoya"],["heart","yurak"],["brain","miya"],["learn","o'rganmoq"],["teach","o'rgatmoq"],["write","yozmoq"],["think","o'ylamoq"],["early","erta"],["voice","ovoz"],["peace","tinchlik"],["trust","ishonch"],["brave","jasur"],["proud","g'ururli"],["truth","haqiqat"],["power","kuch"],["youth","yoshlik"],["glass","oyna, stakan"],["table","stol"],["chair","stul"],["clock","soat"],["ocean","okean"],["night","tun"],["earth","yer"],["stone","tosh"]];
let W;
function wordle(){W={a:shuffle(W5)[0],g:[],cur:"",st:"play",ks:{},msg:""};wDraw();}
function wScore(g,a){const r=Array(5).fill("x"),left={};for(let i=0;i<5;i++){if(g[i]==a[i])r[i]="g";else left[a[i]]=(left[a[i]]||0)+1;}for(let i=0;i<5;i++){if(r[i]!="g"&&left[g[i]]>0){r[i]="y";left[g[i]]--;}}return r;}
function wDraw(){
 let rows="";
 for(let r=0;r<6;r++){let cells="";for(let c=0;c<5;c++){let ch="",cl="";if(r<W.g.length){ch=W.g[r].w[c];cl=W.g[r].s[c];}else if(r==W.g.length&&W.st=="play")ch=W.cur[c]||"";cells+=`<div class="wt ${cl}">${ch}</div>`;}rows+=`<div class="wr">${cells}</div>`;}
 const play=W.st=="play";
 const kb=["qwertyuiop","asdfghjkl","zxcvbnm"].map((r,ri)=>`<div class="kr">${ri==2?`<button class="alt" style="flex:1.6" onclick="wEnter()">OK</button>`:""}${[...r].map(c=>`<button class="${W.ks[c]||""}" onclick="wType('${c}')">${c.toUpperCase()}</button>`).join("")}${ri==2?`<button class="alt" style="flex:1.6" onclick="wBack()">⌫</button>`:""}</div>`).join("");
 const end=W.st=="won"?`<p style="text-align:center">🎉 <b>Barakalla!</b> ${W.g.length}-urinishda topdingiz.<br><b>${W.a[0].toUpperCase()}</b> — ${esc(W.a[1])}</p>`:`<p style="text-align:center">😅 Bu safar topilmadi.<br>So'z: <b>${W.a[0].toUpperCase()}</b> — ${esc(W.a[1])}</p>`;
 app.innerHTML=`<h2>🟩 5 harfli so'z</h2><div class="sub">Ma'nosi: <b>${esc(W.a[1])}</b></div><div class="wg">${rows}</div>${W.msg?`<p style="text-align:center">${W.msg}</p>`:""}${play?kb+`<p class="sub">🟩 harf va joyi to'g'ri · 🟨 harf bor, joyi boshqa · ⬛ bunday harf yo'q</p>`:end+`<button onclick="wordle()">🔄 Yangi so'z</button> <button class="alt" onclick="game()">O'yinlar</button>`}`;
}
function wType(c){if(W.st!="play"||W.cur.length>=5)return;W.cur+=c;W.msg="";wDraw();}
function wBack(){if(W.st!="play")return;W.cur=W.cur.slice(0,-1);W.msg="";wDraw();}
function wEnter(){
 if(W.st!="play")return;
 if(W.cur.length<5){W.msg="5 ta harf yozing";wDraw();return;}
 const r=wScore(W.cur,W.a[0]),rk={x:1,y:2,g:3};
 W.g.push({w:W.cur,s:r});
 for(let i=0;i<5;i++){const ch=W.cur[i];if(!W.ks[ch]||rk[r[i]]>rk[W.ks[ch]])W.ks[ch]=r[i];}
 if(W.cur==W.a[0])W.st="won";else if(W.g.length>=6)W.st="lost";
 W.cur="";W.msg="";wDraw();
}

/* Quiz */
let Q;
function quiz(){app.innerHTML=`<h2>📝 Quiz</h2><p class="sub">Kitobni tanlang</p>`+BOOKS.map((b,i)=>`<button class="opt" onclick="startQuiz(${i})">📖 ${esc(b.t)}</button>`).join("");}
function startQuiz(i){Q={b:i,n:0,s:0,qs:BOOKS[i].q.map(q=>{const o=q[1].map((t,k)=>[t,k==q[2]]);return{t:q[0],o:shuffle(o)};})};showQ();}
function showQ(){
 if(Q.n>=Q.qs.length){app.innerHTML=`<h2>🏁 Natija</h2><div class="card"><div class="word">${Q.s} / ${Q.qs.length}</div></div><button onclick="startQuiz(${Q.b})">🔄 Qayta</button> <button class="alt" onclick="quiz()">Kitoblar</button>`;return;}
 const q=Q.qs[Q.n];
 app.innerHTML=`<div class="sub">${esc(BOOKS[Q.b].t)} · ${Q.n+1}/${Q.qs.length}</div><h2>${esc(q.t)}</h2>`+q.o.map((o,k)=>`<button class="opt" onclick="ans(${k},this)">${"ABC"[k]}) ${esc(o[0])}</button>`).join("");
}
function ans(k,el){const q=Q.qs[Q.n];const bs=[...app.querySelectorAll(".opt")];bs.forEach((b,i)=>{b.disabled=true;if(q.o[i][1])b.classList.add("ok");});if(q.o[k][1])Q.s++;else el.classList.add("no");setTimeout(()=>{Q.n++;showQ();},1100);}

/* Notes */
function notes(){store.get("notes",v=>{let n=[];try{n=JSON.parse(v)||[]}catch(e){}drawNotes(n);});}
function drawNotes(n){
 app.innerHTML=`<h2>🗒 Eslatmalar</h2><textarea id="nt" maxlength="300" placeholder="Muhim fikr yoki iqtibosni yozing..."></textarea><p><button onclick="addNote()">➕ Saqlash</button></p><div id="nl">`+(n.length?n.map((t,i)=>`<div class="card">${esc(t)}<p><button class="alt" onclick="delNote(${i})">🗑 O'chirish</button></p></div>`).join(""):`<p class="sub">Hozircha eslatma yo'q.</p>`)+`</div>`;
 window._n=n;
}
function addNote(){const t=$("#nt").value.trim();if(!t)return;const n=[t,...window._n];if(JSON.stringify(n).length>3900){alert("Joy tugadi. Eskisini o'chiring.");return;}store.set("notes",JSON.stringify(n));drawNotes(n);}
function delNote(i){const n=window._n.filter((_,k)=>k!=i);store.set("notes",JSON.stringify(n));drawNotes(n);}

/* Insights */
function ins(){app.innerHTML=`<h2>💡 Insight'lar</h2>`+BOOKS.map((b,i)=>`<div class="card"><b>📖 ${esc(b.t)}</b><ol>${b.i.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></div>`).join("");}

/* Chat */
function chat(){app.innerHTML=`<h2>💬 Chat</h2><div class="card"><p>Savol yoki taklifingiz bormi? Menga to'g'ridan-to'g'ri yozing.</p><button onclick="openChat()">Menga yozish</button></div>`;}
function openChat(){const u="https://t.me/"+MY_USERNAME;if(tg&&tg.openTelegramLink)tg.openTelegramLink(u);else window.open(u,"_blank");}

go("game");
</script>
